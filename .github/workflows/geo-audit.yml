name: Synaptik GEO audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/geo-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit public Synaptik website
        id: geo
        uses: Auriti-Labs/geo-optimizer-skill@v4.20.0
        with:
          url: https://synaptikstudio.fr
          format: json
          output-file: synaptik-geo-audit
      - name: Summarize
        if: always()
        run: |
          echo "## Audit GEO Synaptik Studio" >> "$GITHUB_STEP_SUMMARY"
          echo "Score: ${{ steps.geo.outputs.score }}/100" >> "$GITHUB_STEP_SUMMARY"
          echo "Niveau: ${{ steps.geo.outputs.band }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Save report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synaptik-geo-audit
          path: synaptik-geo-audit.json
          if-no-files-found: warn
          retention-days: 30
