name: Import approved HUD reference assets

on:
  push:
    paths:
      - '.github/workflows/import-hud-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download approved reference images
        shell: bash
        env:
          HERO_URL: "https://at.adobe.com/YvQRrx1m8BO5yjqJ"
          CONTACT_URL: "https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:9056fa9e-599b-4521-8ee4-36edfc74c0d6"
        run: |
          set -euo pipefail
          mkdir -p assets/hud
          curl -L --fail --retry 3 --retry-all-errors "$HERO_URL" -o assets/hud/hero-vitruvian-reference.png
          curl -L --fail --retry 3 --retry-all-errors "$CONTACT_URL" -o assets/hud/contact-globe-reference.png
          file assets/hud/hero-vitruvian-reference.png
          file assets/hud/contact-globe-reference.png
          test -s assets/hud/hero-vitruvian-reference.png
          test -s assets/hud/contact-globe-reference.png

      - name: Commit assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "synaptik-work"
          git config user.email "actions@users.noreply.github.com"
          git add assets/hud/hero-vitruvian-reference.png assets/hud/contact-globe-reference.png
          if git diff --cached --quiet; then
            echo "Assets already current"
            exit 0
          fi
          git commit -m "Add approved HUD reference images"
          git push
