<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Synaptik Reel</title>
<meta name="robots" content="noindex,follow">
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif;color:#fff}
.wrap{position:fixed;inset:0;background:#000}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.38);z-index:2;cursor:pointer}
#fallback button{appearance:none;border:1px solid rgba(255,255,255,.7);background:rgba(0,0,0,.65);color:#fff;font-size:15px;letter-spacing:.08em;padding:14px 22px;cursor:pointer}
#back{position:fixed;top:18px;left:18px;z-index:3;color:#fff;text-decoration:none;font-size:12px;letter-spacing:.08em;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.35);padding:9px 12px}
</style>
</head>
<body>
<div class="wrap">
  <iframe id="reel" src="https://player.vimeo.com/video/1223586438?autoplay=1&muted=0&playsinline=1&title=0&byline=0&portrait=0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen title="Synaptik Reel"></iframe>
  <div id="fallback"><button type="button">LANCER LE REEL</button></div>
</div>
<a id="back" href="./">SYNAPTIK ↗</a>
<script src="https://player.vimeo.com/api/player.js"></script>
<script>
(function(){
  var iframe=document.getElementById('reel');
  var fallback=document.getElementById('fallback');
  var player=new Vimeo.Player(iframe);
  player.setVolume(1).catch(function(){});
  player.play().then(function(){fallback.style.display='none';}).catch(function(){fallback.style.display='flex';});
  fallback.addEventListener('click',function(){
    player.setVolume(1).catch(function(){});
    player.play().then(function(){fallback.style.display='none';});
  });
})();
</script>
</body>
</html>
